# Builds the plugin and publishes a GitHub release whenever the version in
# manifest.json changes on main (or a version tag is pushed / a release is
# published on github.com). BRAT on the iPad then installs it automatically.
name: Release

on:
  push:
    branches: [main]
    paths: ["manifest.json", ".github/workflows/release.yml"]
    tags: ["*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          FILES="build/main.js build/manifest.json build/styles.css"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" $FILES --clobber
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" \
              --title "Handnote $VERSION" --generate-notes $FILES
          fi

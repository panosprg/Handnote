# Builds the plugin and publishes a GitHub release whenever a version tag
# (e.g. 0.3.0) is pushed. BRAT on your iPad picks the release up automatically.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Handnote ${GITHUB_REF_NAME}" \
            --generate-notes \
            build/main.js build/manifest.json build/styles.css
